# Full nginx configuration, replacing the stock /etc/nginx/nginx.conf.
#
# Why this file exists rather than a conf.d snippet: `limit_req_zone` is an
# http-level directive and cannot live in a server block, so the stock file
# — which has no zones — could not rate-limit anything. Editing this file is
# the only way to get nginx itself to refuse a burst, which matters because
# ArvanCloud sends every request from one address: without a zone here, the
# first line of defence is the Python limiter, which runs after TLS, after
# parsing, and after a database connection.
#
# Everything the default file did that this deployment needs is kept:
# worker count, the conf.d include, gzip, and the mime types.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"'
                      ' cdn="$http_cf_connecting_ip" peer="$realip_remote_addr"'
                      ' guard="$not_from_cdn"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 8m;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml text/javascript;
    gzip_min_length 512;

    # ── Rate limit zones ────────────────────────────────────────────
    # Keyed on $binary_remote_addr, which `real_ip` has already rewritten to
    # the visitor's address, so one abusive client cannot spend a village's
    # budget — and one village cannot be locked out by one client.
    #
    # The API as a whole: generous, only there to stop a loop.
    limit_req_zone $binary_remote_addr zone=api_all:10m rate=30r/s;
    # Login and password recovery: a credential-stuffing script needs
    # thousands of tries; a person needs three. 10/min with a burst of 5
    # leaves a normal login immediate and a script crawling.
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    # The catch-all for cached assets: high enough to never touch a real
    # visitor loading a page with 40 assets, low enough to stop a flood.
    limit_req_zone $binary_remote_addr zone=static_all:10m rate=120r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 40;

    # ── "Did this request come through the CDN?" ───────────────────────
    #
    # A `map`, not a chain of `if`s. `set` inside an `if` only runs when
    # that test passes, so the variable a later `if` reads can be
    # uninitialised — which is exactly what shipped. The only evidence was
    #     [warn] using uninitialized "origin_direct" variable
    # in the error log, and it meant the origin guard silently did
    # nothing at all.
    #
    # Two signals, either one is enough:
    #   * the request carries `CF-Connecting-IP` — ArvanCloud adds it on
    #     the way in, and a direct hit does not have it (measured
    #     2026-11-03: present via https://pawsmarket.ir, absent when
    #     posting to 87.107.130.85 with the Host header);
    #   * the peer is a private address — docker's bridge or the box
    #     itself: deploy checks and the health probe.
    #
    # Forging the header is possible, and it is the harmless direction:
    # a caller who sends it has declared themselves the CDN, every
    # per-visitor limit keyed on `real_ip` still applies, and they cannot
    # reach the origin without going through ArvanCloud's edge anyway.
    # The peer, and nothing else. ArvanCloud does NOT send CF-Connecting-IP
    # to this origin — measured with the log fields below: `cdn="-"` on a
    # request that plainly came through the edge. So a header test cannot
    # distinguish the two paths at all, and the decision rests on the
    # address the socket actually came from.
    map $realip_remote_addr $origin_direct {
        default                                1;
        "~^127\."                              0;   # the box itself
        "~^10\."                               0;   # docker bridge
        "~^192\.168\."                         0;
        "~^172\.(1[6-9]|2[0-9]|3[01])\."       0;
    }

    # ── Restore the real client from the CDN ─────────────────────────
    # `geo $var` tests `$remote_addr`, which `real_ip` has already replaced
    # with the visitor's address — so the one-argument form would ask "is
    # the visitor an Arvan edge?", refuse every real visitor, and take the
    # site down. It has to read `$realip_remote_addr`, which is the socket
    # peer and is not rewritten. The two-argument `geo` below does that.
    #
    # ── Which header carries the visitor ─────────────────────────────
    #
    # `X-Forwarded-For`, NOT `CF-Connecting-IP`. Measured 2026-11-03: Arvan
    # does not send `CF-Connecting-IP` to this origin at all — every access
    # log line reads `cdn="-"` even for requests that plainly came through
    # the edge. With `real_ip_header CF-Connecting-IP` the substitution
    # therefore never happens, `$remote_addr` stays the edge address, and
    # the per-visitor rate limits collapse into one bucket shared by the
    # whole country. That is the exact bug `real_ip` exists to prevent, so
    # getting this header name wrong is silent and total.
    #
    # Verified the same way: my own address 205.252.135.234 makes a request
    # via the CDN, and the log's `"$http_x_forwarded_for"` field reads
    # `185.120.221.19, 205.252.135.234` — Arvan appends the real client to
    # the right of the chain.
    #
    # `real_ip_recursive on` is what makes a forged left-hand value
    # useless: the walk starts at the right and only steps over hops that
    # are in the list above, so a caller-supplied `XFF: 6.6.6.6` cannot
    # become `$remote_addr`.
    #
    # `real_ip` itself needs the ranges as `set_real_ip_from` directives,
    # which cannot be derived from a `geo`. So the list exists twice, and
    # twice only — here and in `arvan-edge-ips.conf` — adjacent under the
    # same comments, so they can only be edited together.
    # `_perf/check_origin_guard.py` compares the two sets and fails the
    # deploy if they drift.
    set_real_ip_from 185.143.232.0/22;
    set_real_ip_from 188.229.116.16/30;
    set_real_ip_from 94.101.182.0/27;
    set_real_ip_from 2.144.3.128/28;
    set_real_ip_from 37.32.16.0/27;
    set_real_ip_from 37.32.17.0/27;
    set_real_ip_from 37.32.18.0/27;
    set_real_ip_from 37.32.19.0/27;
    set_real_ip_from 185.215.232.0/22;
    set_real_ip_from 178.131.120.48/28;
    set_real_ip_from 94.101.183.0/28;
    set_real_ip_from 78.157.36.112/28;
    set_real_ip_from 95.38.61.80/28;
    set_real_ip_from 193.24.119.0/29;
    # NOT 185.120.221.19. That address belongs to Asiatech and is what this
    # operator's own outbound traffic leaves from — a direct hit to the
    # origin IP arrives with it as the peer. Listing it (an earlier version
    # did) made `real_ip` treat a stranger as a trusted edge and honour
    # whatever X-Forwarded-For they sent.
    #
    # Measured 2026-11-03, same second, same URL shape:
    #   via https://pawsmarket.ir → peer 94.101.183.3   (Arvan range)
    #   direct to 87.107.130.85   → peer 185.120.221.19 (Asiatech)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Requests that reached the box without the CDN's header ────────
    # The `geo` half of the same list. Single-sourced so the guard, the
    # real_ip trust list above, and any future reader cannot disagree.
    include /etc/nginx/arvan-edge-ips.conf;

    # Assigned by the guards in the server block below; declared here so
    # it always exists (an `if` that never fires must not leave it empty).
    map "" $not_from_cdn { default 0; }

    include /etc/nginx/conf.d/*.conf;
}
