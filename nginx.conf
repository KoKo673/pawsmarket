# nginx for the SPA, the API it calls, and the uploads it serves.
#
# One domain, three responsibilities:
#
#   /            static files, with SPA fallback
#   /api/        proxied to the backend container (never exposed directly)
#   /media/      uploaded images, read straight from the shared volume
#
# The single-domain shape is deliberate. Everything the browser fetches is
# same-origin, so there is no CORS on the hot path and no cross-site cookie to
# defend — and the frontend needs no change, because it already builds API and
# media URLs relative to the page when VITE_API_BASE_URL is empty.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images are written by the backend at 5MB (MAX_BYTES in
    # media.py) and nginx refuses anything over 1MB by default with a 413 that
    # never reaches FastAPI — so a photo the API would happily accept is
    # rejected before it gets there. 6MB leaves room for multipart framing.
    client_max_body_size 6m;

    # ── Compression ────────────────────────────────────────────────
    # The bundle is ~1.6MB of JS, which is the single biggest thing a cold
    # visitor downloads. Note what is NOT compressed: images. JPEG and WebP are
    # already compressed, and running gzip over them spends CPU to make files
    # marginally larger.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Security headers ───────────────────────────────────────────
    # `nosniff` matters most: without it a browser may decide a .txt uploaded
    # through /media is HTML and run it in this origin. The API validates
    # extensions, but this is the second lock on the same door.
    #
    # NOTE ON SCOPE, because this is an nginx trap: `add_header` does not
    # merge. A location that declares any add_header of its own discards
    # *every* add_header inherited from the server block. So each location
    # below that sets Cache-Control repeats these three; omitting them would
    # silently strip nosniff from exactly the route that serves
    # user-uploaded files, which is where it matters most.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content-Security-Policy ────────────────────────────────────
    #
    # Written against the origins this app was measured to load, not from
    # a template. Each allowance below exists because removing it broke
    # something specific:
    #
    #   tile.openstreetmap.org   the Leaflet map. Without it Explore is
    #                            a grey rectangle.
    #   dkstatics-public...      product photos. They are hot-linked from
    #                            the source; the alternative is mirroring
    #                            every image, which is a separate job.
    #   'unsafe-inline' style    Leaflet writes transform styles onto
    #                            panes at runtime. A nonce cannot cover a
    #                            style attribute set by a third-party
    #                            library, so style-src needs it. Script
    #                            keeps 'self' only - this is the half that
    #                            actually stops injected <script>.
    #   blob:                    the map surface builds object URLs.
    #
    # `frame-ancestors 'self'` restates X-Frame-Options for browsers that
    # prefer the newer header; both are sent on purpose.
    #
    # Deliberately NOT included: 'unsafe-eval' (nothing here evals),
    # https: as a blanket source (that would make the rest decorative),
    # or a wildcard for images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://dkstatics-public.digikala.com https://image.torob.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # ── Restore the real client from the CDN ───────────────────────
    # Measured 2026-10-31: every visitor arriving through ArvanCloud had
    # nginx's `$remote_addr` set to a CDN edge address, so the rate limiter
    # bucketed *all* of them together — one visitor's traffic spent
    # everyone's budget. And a request sent straight to the origin IP (which
    # answers on :80) had its X-Forwarded-For passed through untouched, so
    # `XFF: 6.6.6.6` and `XFF: 7.7.7.7` created two buckets and defeated
    # every per-address limit.
    #
    # `real_ip` fixes both at the source: nginx replaces `$remote_addr`
    # with the rightmost address in X-Forwarded-For that is NOT a trusted
    # proxy. From then on `$remote_addr` is the client, and
    # `X-Forwarded-For $remote_addr` below emits exactly one entry — the
    # one nginx vouched for — no matter what the caller sent.
    #
    # `real_ip_recursive on` is what makes a forged left-hand value
    # useless: the walk starts at the right and only steps over hops that
    # are in `set_real_ip_from`.
    #
    # The ranges are the two ArvanCloud /22s observed in this
    # deployment's own logs. A typo here is silent in the safe direction:
    # nginx simply never substitutes, and the limiter falls back to the
    # edge address (coarse, but never attacker-controlled).
    set_real_ip_from 185.120.220.0/22;
    set_real_ip_from 94.101.180.0/22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── The API ────────────────────────────────────────────────────
    # `backend` is the compose service name. The backend publishes no host
    # port, so this is the only route to it — which is what keeps the rate
    # limiter meaningful. If the API were reachable directly, a caller could
    # skip nginx and forge X-Forwarded-For, and every per-address limit in
    # ratelimit.py would be trivially defeated.
    location /api/ {
        proxy_pass http://backend:5000;

        # The backend runs with TRUST_PROXY=1 and reads X-Forwarded-For from
        # the right, skipping hops listed in TRUSTED_PROXIES. Because this
        # block now sends exactly one entry — the address `real_ip` resolved
        # — there is nothing for the backend to walk past, and nothing a
        # caller sent can survive.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ── $remote_addr, not $proxy_add_x_forwarded_for ─────────
        # The append form forwards whatever the caller sent and puts nginx's
        # peer on the end — so a forged value survives into the backend.
        # With `real_ip` above, `$remote_addr` IS the client, so this emits
        # exactly one entry that nginx itself vouched for. Overwrite, never
        # append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image uploads take longer than nginx's 60s default on a slow link,
        # and a cut-off upload is a 502 the user cannot explain.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Health ─────────────────────────────────────────────────────
    # Proxied, not served from disk. Without this, /health falls into the SPA
    # location below and returns index.html with 200 — so a healthcheck always
    # passes and never notices a backend that is down, and an uptime monitor
    # watches a static file while the API is on fire.
    #
    # Measured: before this block, `curl /health` returned the app's index.html
    # rather than the API's {"status":"ok"}.
    #
    # `access_log off` because a monitor polls this every minute and the line
    # carries no information.
    location = /health {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ── $remote_addr, not $proxy_add_x_forwarded_for ─────────
        # The append form forwards whatever the caller sent and puts nginx's
        # peer on the end — so a forged value survives into the backend.
        # With `real_ip` above, `$remote_addr` IS the client, so this emits
        # exactly one entry that nginx itself vouched for. Overwrite, never
        # append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Uploaded media ─────────────────────────────────────────────
    # Served by nginx from the volume the backend writes to, not proxied
    # through FastAPI: these are 67MB of images and Python serving them would
    # occupy the same single worker that answers API calls.
    location /media/ {
        alias /var/www/media/;

        # Filenames are `secrets.token_hex(16) + ext`, so a given URL never
        # changes content. `immutable` lets the browser skip revalidation
        # entirely for a year.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # A missing image must 404 rather than fall through to the SPA and
        # return index.html with 200 — that renders as a broken image whose
        # response looked perfectly fine, which is a bad hour to debug.
        #
        # =404 is the target and there is no error_page for 404 in this file.
        # That is deliberate: a server-level `error_page 404 /index.html`
        # would be inherited here and turn this back into the exact behaviour
        # it is written to prevent.
        try_files $uri =404;
    }

    # ── Store images ───────────────────────────────────────────────
    # These live under /images/ (written by the enrichment import), not
    # /media/ which the backend writes at upload time. Without this block
    # they fell through to `location /` and were served with no
    # Cache-Control at all — measured 2026-10-31: only ETag and
    # Last-Modified, so every visit revalidated all 447 photos.
    #
    # The filenames are content-addressed (a 16-hex id), so a URL's bytes
    # never change and `immutable` is honest. 30 days rather than a year:
    # a re-import writes a new filename, and a month bounds how long an
    # old one lingers in a browser cache.
    location /images/ {
        # Only add_header, no `expires`: both would emit a Cache-Control and
        # the response carried two (measured). One explicit header is the
        # one a reader can trust.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # Repeated rather than inherited: add_header does not carry into a
        # location that declares its own, which is the trap the roadmap
        # warned about for this exact block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Build assets ───────────────────────────────────────────────
    # Vite fingerprints these filenames, so a new build produces new URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ── The SPA ────────────────────────────────────────────────────
    # Every unknown path returns index.html and 200, because /explore, /pet/12
    # and /login are client-side routes: a direct load or a refresh hits nginx
    # first, and answering 404 there would break every shared link.
    #
    # This is also why the 404.html trick that GitHub Pages needed is not used
    # here — that existed only because Pages cannot be told to rewrite.
    location / {
        # `$uri/index.html` rather than `$uri/`: a trailing slash on
        # `$uri/` makes nginx answer 301 to the slash form, and the
        # prerendered pages are reached at the no-slash URL a clinic
        # actually shares. The `/index.html` fallback keeps every
        # client-side route working where no file was prerendered.
        try_files $uri $uri/index.html /index.html;
    }

    # index.html is deliberately NOT cached. It is the file that names the
    # hashed asset URLs, so a browser holding a stale copy keeps requesting
    # bundles that no longer exist after a deploy — the site loads, then fails
    # unaccountably until a hard refresh. Everything it points at is immutable
    # and cached, so re-fetching this one small file costs almost nothing.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Repeated deliberately. This is the block every SPA route lands
        # in, and `add_header` does not merge — declaring Cache-Control
        # here discarded the CSP inherited from the server block, so the
        # page that most needs it was the one page that never got it.
        # Measured: origin returned nosniff and X-Frame-Options but no
        # content-security-policy at all.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://dkstatics-public.digikala.com https://image.torob.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }
}
