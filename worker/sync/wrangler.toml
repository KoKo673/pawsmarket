name = "pawsmarket-sync"
main = "index.js"
compatibility_date = "2024-11-01"

# Twice a day, at :17 — the hour is busy on the internet and these
# sources have no published quota. Offset from the VPS timer (04:17 and
# 16:47) so the two never collide on the same minute.
[triggers]
crons = ["17 */12 * * *"]

# API_BASE and ADMIN_KEY are secrets, not vars: `wrangler secret put`.
# Putting ADMIN_KEY here would commit the catalogue key to the repo.
