# ArvanCloud edge networks — THE ONLY COPY of this list.
#
# This file is included by both nginx.conf files. It used to be copy-pasted
# into three directives, and the copies had already drifted apart before
# anyone noticed, because every way they can disagree fails silently:
#
#   * missing from the `geo`  → that region's visitors are refused (403);
#   * missing from `set_real_ip_from` → those visitors all share one
#     rate-limit bucket, so one busy address throttles a whole city;
#   * present in `set_real_ip_from` but meant to be excluded → a caller can
#     forge their own address with a header.
#
# Do not paste these ranges anywhere else. Include this file.
#
# ── Measured ──────────────────────────────────────────────────────────
# 2026-11-03, same second, same URL shape, from the origin's access log
# (which records `peer=` — the socket address — on every line):
#
#   via https://pawsmarket.ir  → peer 94.101.183.3    (listed below)
#   direct to 87.107.130.85    → peer 185.120.221.19  (NOT listed, and
#                                 must never be: it is Asiatech, this
#                                 operator's own uplink. Listing it made
#                                 the guard permit exactly the requests
#                                 it exists to refuse.)
#
# The domain resolves to 185.143.233.133 / 185.143.234.133, inside
# 185.143.232.0/22.
#
# ── Failure mode if these go stale ────────────────────────────────────
# If Arvan adds an edge range and this file is not updated, visitors behind
# it get 403 and nothing in any dashboard says why. The guard script
# `_perf/check_origin_guard.py` is the alarm: it fails when the guard
# refuses, and its log fields make the responsible peer obvious.

geo $realip_remote_addr $arvan_peer {
    default           0;
    185.143.232.0/22  1;
    188.229.116.16/30 1;
    94.101.182.0/27   1;
    2.144.3.128/28    1;
    37.32.16.0/27     1;
    37.32.17.0/27     1;
    37.32.18.0/27     1;
    37.32.19.0/27     1;
    185.215.232.0/22  1;
    178.131.120.48/28 1;
    94.101.183.0/28   1;
    78.157.36.112/28  1;
    95.38.61.80/28    1;
    193.24.119.0/29   1;
}

# The `set_real_ip_from` half of the list lives in `nginx-main.conf`,
# immediately above the `include` of this file. nginx has no way to turn a
# `geo` into `set_real_ip_from`, so that copy cannot be eliminated — the two
# are kept adjacent and cross-referenced so they are only ever edited
# together. **Adding a range means editing both halves and running
# `_perf/check_origin_guard.py`, which compares the two sets.**
