<!doctype html>
<html lang="fa" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- PWA. Without this link the manifest exists and nothing reads it:
         the browser never discovers it, the site is not installable, and
         the icons and standalone display are inert. Measured 2026-11-12:
         /manifest.webmanifest answered 404 on the live site while NFR-4.6
         claimed "PWA / آفلاین ✅" in the SRS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Brand-accurate browser chrome (light + dark) -->
    <meta name="theme-color" content="#FA5C00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191612" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="پازمارکت — حیوانات خانگی، لوازم و فروشگاه‌های اطراف شما روی یک نقشه‌ی زنده."
    />
    <title>پازمارکت — حیوانات و لوازم نزدیک شما</title>

    <!-- Google Search Console ownership. Verification happens in two ways,
         and only one is used:
         - Meta tag (this line, filled once by the operator from Search
           Console → Settings → Ownership verification).
         - DNS TXT record, preferred for a domain you control, because it
           survives a redesign and a copied index.html. When the DNS record
           is in place this meta can stay empty — the verification that
           matters is the DNS one.
         Build-time: the token is read by prerender.mjs from
         VITE_GSC_VERIFICATION (see .env.production). If it is empty the
         placeholder line below is removed, so a shipped page never carries
         an unverified token. -->
    <!--google-site-verification-->

    <!-- Typography: Vazirmatn, self-hosted (SIL OFL 1.1).
         Was fonts.googleapis.com — a foreign dependency for a domestic
         audience, and until it loaded the page painted in the fallback face.
         ONE variable font file carries every weight 100–900 through its wght
         axis (the first attempt had copied Google's static instance six times
         under twelve names). Generated by scripts/fetch_fonts.py. -->
    <link rel="preload" href="/fonts/Vazirmatn-var.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/vazirmatn.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
