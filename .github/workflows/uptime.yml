name: Uptime

# ── Why this exists ──────────────────────────────────────────────────
# The roadmap's Phase 6 is one line: «وقتی چیزی می‌شکند، قبل از مشتری
# بفهمیم». Everything else in that phase reads the database from inside the
# server — which cannot answer the one question that matters most: is the
# server there at all?
#
# A process cannot alert about its own host being down. If the VPS loses
# power, runs out of disk, or nginx stops answering, every check on it stops
# with it and the silence looks exactly like "nothing is wrong".
#
# So this runs somewhere else: GitHub's runners. No new account, no new
# service to pay for or forget to renew, and a failed run emails the repo
# owner by default.
#
# ── What it checks, and why these four ──────────────────────────────
#   1. https://pawsmarket.ir/          the site a customer types
#   2. https://pawsmarket.ir/health    the API, which runs `SELECT 1`
#   3. a real store page                prerendered HTML, i.e. nginx's
#                                       try_files and the build output
#   4. sitemap.xml                     text/xml, not the SPA fallback
#
# One URL would be enough to know the server answers. These four are here
# because each has failed in a different way during this project:
#
#   · /health once returned index.html with 200 — a monitor watching it
#     would have been watching a static file while the API was on fire
#   · /store/<slug> once answered 301 because `try_files $uri/` is a
#     directory test
#   · sitemap.xml was HTML nobody could parse, because nginx fell through
#
# Each check asserts something a plain 200 would not: the content type, the
# body, and that a redirect is not happening.
#
# ── Timing ──────────────────────────────────────────────────────────
# Every 15 minutes. Faster costs GitHub Actions minutes for no benefit — a
# five-minute outage at 03:00 is already over by the time anyone reads the
# email, and the roadmap's own example is a *twenty-day* outage.
#
# Note on scheduling: GitHub delays cron runs under load, and a repository
# with no pushes in 60 days has its scheduled workflows disabled. That is
# free-tier behaviour, not a bug in this file; a real uptime service is the
# answer if that ever matters.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:      # so it can be run by hand after a deploy

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # retries=3 with a delay: a single failed request is a network blip on
      # the runner, not an outage. Three failures across ~30 seconds is a
      # server that is actually down.
      - name: The site answers
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-connrefused --max-time 20 \
            https://pawsmarket.ir/)
          echo "GET / -> $code"
          [ "$code" = "200" ]

      - name: The API answers, and its database answers
        run: |
          body=$(curl -sS --retry 3 --retry-delay 5 --retry-connrefused \
            --max-time 20 https://pawsmarket.ir/health)
          echo "GET /health -> $body"
          # `health()` runs `SELECT 1` before answering, so this string
          # means the process AND its database are alive. A 200 with
          # index.html would fail here, which is the point.
          echo "$body" | grep -q '"status":"ok"'

      - name: A prerendered store page still renders
        run: |
          # One real slug, not the first row: a page that 404s would pass a
          # looser check as long as the SPA fallback returned index.html.
          url=https://pawsmarket.ir/store/pansyvn-ghlah-hyvanat
          code=$(curl -sS -o /tmp/store.html -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 20 "$url")
          redirects=$(curl -sS -o /dev/null -w '%{num_redirects}' \
            --max-time 20 "$url")
          echo "GET $url -> $code, redirects=$redirects"
          [ "$code" = "200" ]
          # A 301 on the URL a clinic puts in its bio costs a round trip on
          # a slow link and defeats some link-preview fetchers.
          [ "$redirects" = "0" ]
          # The prerendered content must be in the RAW html — that is the
          # whole reason the prerender exists.
          grep -q 'پانسیون قلعه' /tmp/store.html

      - name: The sitemap is XML
        run: |
          type=$(curl -sS -o /tmp/sitemap.xml -w '%{content_type}' \
            --retry 3 --retry-delay 5 --max-time 20 \
            https://pawsmarket.ir/sitemap.xml)
          echo "content-type: $type"
          echo "$type" | grep -qi 'xml'
          grep -q '<urlset' /tmp/sitemap.xml
          locs=$(grep -c '<loc>' /tmp/sitemap.xml)
          echo "sitemap URLs: $locs"
          # 447 stores + 3 static pages. A sitemap with three entries means
          # the prerender ran with no data and exited 0 — which is exactly
          # what it is designed to do when the API is unreachable at build
          # time, and exactly what nobody would notice.
          [ "$locs" -gt 400 ]
